version: 1
id: work
command: work
description: "Jira or brief → plan → worktree → TDD → review → PR/MR."
start: intake
maxStepVisits: 30
summaryMaxChars: 30000
steps:
  intake:
    title: Pull Jira or normalize the brief
    prompt: {file: steps/work/intake.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      bash: {mode: unrestricted}
    transitions: {ready: plan, blocked: $pause, handoff: intake}
  plan:
    title: Plan work for Plannotator
    prompt: {file: steps/work/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, github/get_file_contents, gitlab]
      bash: {mode: unrestricted}
    gate:
      artifactContract:
        maxChars: 30000
        requiredHeadings:
          - { level: 2, title: Goal/Acceptance Criteria, guidance: "State the observable outcome and acceptance criteria." }
          - { level: 2, title: Non Goal, guidance: "State explicitly excluded work." }
          - { level: 2, title: Implementation Steps and Tests, guidance: "List only add/remove steps. List a test only when it has an assessable benefit." }
          - { level: 2, title: Validation, guidance: "Give exact independent Bash commands and their expected proof." }
          - { level: 2, title: Risks/Decisions Needed, guidance: "State risks and unresolved decisions." }
          - { level: 2, title: Publications Contract/Metadata, guidance: "Provide observed provider/repository/target, source branch, semantic title, description template, traceability mode, and Jira key or null. Jira mode requires exactly one [KEY] in the title; requirement mode permits no bracketed key." }
          - { level: 2, title: Execution appendix (machine-readable), guidance: "Provide JSON with repositories (sourceRoot, baseHead, branch, worker, reviewer), traceability, and publication (provider, repository, sourceBranch, targetBranch, title, descriptionTemplate, managedDescription)." }
    transitions: {ready: prepare-workspace, gaps: intake, blocked: $pause, handoff: plan}
  prepare-workspace:
    title: Create worktree and branch
    prompt: {file: steps/shared/prepare-workspace.md}
    agent: scout
    maxToolCalls: 10
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: implement, gaps: plan, blocked: $pause, handoff: prepare-workspace}
  implement:
    title: Implement approved plan with TDD
    prompt: {file: steps/work/implement.md}
    agent: worker
    maxToolCalls: 120
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [context7]
      skills: [test-driven-development]
      bash: {mode: unrestricted}
    transitions: {ready: verify, blocked: $pause, handoff: implement}
  verify:
    title: Check goal and acceptance criteria
    prompt: {file: steps/work/verify.md}
    agent: reviewer
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash]
      skills: [verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {ready: publish, gaps: implement, blocked: $pause, handoff: verify}
  publish:
    title: Push and open or update PR/MR
    prompt: {file: steps/work/publish-remote.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, github/create_pull_request, github/update_pull_request]
      bash: {mode: unrestricted}
    transitions: {ready: $done, blocked: $pause, handoff: publish}
