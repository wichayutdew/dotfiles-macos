version: 1
id: mr-comment
command: mr-comment
description: "PR/MR URL → comments plan → fix → verify → push and reply."
start: fetch
maxStepVisits: 10
summaryMaxChars: 30000
steps:
  fetch:
    title: Fetch PR/MR evidence
    prompt: {file: steps/mr-comment/fetch.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, context7]
      bash: {mode: unrestricted}
    transitions: {ready: checkout-source, blocked: $pause, handoff: fetch}
  checkout-source:
    title: Check out the source branch
    prompt: {file: steps/mr-comment/checkout-source.md}
    agent: scout
    maxToolCalls: 10
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees, .]
    permissions:
      tools: [read, ls, bash]
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: plan, blocked: $pause, handoff: checkout-source}
  plan:
    title: Decide each review comment
    prompt: {file: steps/mr-comment/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, sourcegraph, context7]
      skills: [receiving-code-review]
      bash: {mode: unrestricted}
    gate:
      artifactContract:
        maxChars: 10000
        requiredHeadings:
          - { level: 1, title: "<Outcome title>", guidance: "Provide an outcome title before the gate artifact." }
          - { level: 2, title: Comments, guidance: "Include every unresolved comment. For each, repeat level-3 Suggestion (what the reviewer asked for), Verdict (whether to implement and how, backed by code evidence), Response message (the human reply to post when handled), and Metadata. Metadata must use one value per bullet, never a packed sentence: commentId, discussionId, reviewer, path, line, and host." }
          - { level: 2, title: Implementation plan, guidance: "List scoped files and observable changes; leave empty for reply-only." }
          - { level: 2, title: Validation, guidance: "List tests or checks with an assessable benefit." }
          - { level: 2, title: Execution appendix (machine-readable), guidance: "Provide JSON with repository, workerCommands, reviewerCommands, and remoteActions; use MCP-first replies and push." }
    transitions: {ready: implement, blocked: $pause, handoff: plan}
  implement:
    title: Apply approved comment fixes
    prompt: {file: steps/mr-comment/implement.md}
    agent: worker
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [context7]
      skills: [test-driven-development]
      bash: {mode: unrestricted}
    transitions: {ready: verify, blocked: $pause, handoff: implement}
  verify:
    title: Check reviewer intent
    prompt: {file: steps/mr-comment/verify.md}
    agent: reviewer
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash]
      skills: [verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {ready: deliver, gaps: implement, blocked: $pause, handoff: verify}
  deliver:
    title: Push and reply
    prompt: {file: steps/mr-comment/publish.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, github/add_issue_comment, github/add_reply_to_pull_request_comment, github/add_comment_to_pending_review]
      bash: {mode: unrestricted}
    transitions: {ready: $done, blocked: $pause, handoff: deliver}
