version: 1
id: sprint-triage
command: sprint-triage
description: "OpsBot API ticket rows → Slack threads → dual summaries → worktree → commit → MR and Confluence."
start: collect
maxStepVisits: 30
summaryMaxChars: 50000
steps:
  collect:
    title: Collect tickets and Slack threads
    prompt: {file: steps/sprint-triage/collect.md}
    agent: scout
    maxToolCalls: 30
    permissions:
      tools: [read, ls, bash, mcp]
      mcp:
        - slack/slack_slack_get_thread_replies
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: collect, blocked: $pause, handoff: collect}
  plan:
    title: Approve KB and human-guide summaries
    prompt: {file: steps/sprint-triage/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 20000
        requiredSubstrings:
          - "# Knowledge-base (LLM)"
          - "- Staged KB report:"
          - "- Path:"
          - "- Integrity SHA-256:"
          - "- Ticket count:"
          - "- Reviewer instruction:"
          - "# Ledger"
          - "- Date period of all supports:"
          - "- Support channels:"
          - "- Number of tickets summarized:"
          - "- Number of tickets skipped due to any issue:"
          - "# Human guide (Confluence)"
          - "## Guide"
          - "- Brief description:"
          - "- Steps to take:"
          - "- Useful links:"
          - "- Existing-guide matches:"
          - "## Publication contract"
          - "## Knowledge Base"
          - "- Title:"
          - "- Description:"
          - "- Exact index Markdown:"
          - "## Confluence"
          - "- Confluence page:"
          - "- Exact top-insert HTML:"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: checkout, changes-requested: plan, retry: plan, blocked: $pause, handoff: plan}
  checkout:
    title: Create knowledge-base worktree
    prompt: {file: steps/sprint-triage/checkout.md}
    agent: scout
    maxToolCalls: 10
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: implement, retry: checkout, blocked: $pause, handoff: checkout}
  implement:
    title: Commit approved KB files
    prompt: {file: steps/sprint-triage/implement.md}
    agent: worker
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: []
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: publish, retry: implement, blocked: $pause, handoff: implement}
  publish:
    title: Open MR and insert Confluence guide
    prompt: {file: steps/sprint-triage/publish.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, gitlab]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: $done, retry: publish, blocked: $pause, handoff: publish}
