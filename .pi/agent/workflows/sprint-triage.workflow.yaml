version: 1
id: sprint-triage
command: sprint-triage
description: "OpsBot API ticket rows → Slack threads → dual summaries → worktree → commit → MR and Confluence."
start: collect
maxStepVisits: 30
summaryMaxChars: 50000
steps:
  collect:
    title: Collect tickets and Slack threads
    prompt: {file: steps/sprint-triage/collect.md}
    agent: scout
    maxToolCalls: 30
    permissions:
      tools: [read, ls, bash, mcp, write]
      mcp:
        - slack/slack_slack_get_thread_replies
      bash: {mode: unrestricted}
    transitions: {ready: plan, blocked: $pause, handoff: collect}
  plan:
    title: Approve KB and human-guide summaries
    prompt: {file: steps/sprint-triage/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      bash: {mode: unrestricted}
    gate:
      artifactContract:
        maxChars: 20000
        requiredHeadings:
          - { level: 1, title: Knowledge base repository, guidance: "Top-level approval section for the files that will be committed to the knowledge-base repository. It must contain the required `## Report` and `## Ledger` subsections only." }
          - { level: 2, title: Report, guidance: "State the staged-report path, immutable SHA-256, ticket count, and reviewer instruction. Before submission, create the complete staged report at /tmp/sprint-triage/<period>/ticket-summaries.md, where period is YYYY-MM-DD_to_YYYY-MM-DD from the Asia/Bangkok collection interval. It must contain one compact record per summarized ticket: Slack URL; Inquiry summary (request, context, impact); Action taken (investigation, mitigation, observed outcome); Knowledge gained (reusable system or process knowledge); and Unknown gap (unverified fact, why it matters, concrete falsifier). Compute SHA-256 after writing and never rewrite the staged file. Block when the staged evidence is missing, unreadable, or exceeds safe redaction limits." }
          - { level: 2, title: Ledger, guidance: "State the ledger that accompanies the knowledge-base report: support date period with start, end, and timezone; support-channel names and IDs; summarized-ticket count; and skipped-ticket count with reasons when nonzero." }
          - { level: 1, title: Confluence top append, guidance: "Top-level approval section for the sole HTML fragment to insert at the top of the configured Confluence page. It must contain the required `## Guides` and `## Publication fragment` subsections only." }
          - { level: 2, title: Guides, guidance: "List only novel reusable guides in compact form. For every retained guide, include Brief description (when it applies), Steps to take (ordered actionable support steps), and Useful links (verified label and URL list, or `None identified`). Omit candidates whose operational trigger/topic or issue and remediation materially overlap existing guidance; state each omitted topic/issue and matching existing heading, or `None`. Inspect threads and existing Confluence context for durable operational references; links must be directly relevant and verified." }
          - { level: 2, title: Publication fragment, guidance: "Provide the complete approved self-contained Confluence HTML top-insert in a fenced html block. Include only retained novel guides: h2 for the sprint addendum, h3 per guide, p with strong description labels, ol/li for ordered steps, ul/li/a for useful links, and p None identified if absent. Do not use Markdown inside the fragment; escape text and attributes; use only verified absolute https:// URLs." }
          - { level: 1, title: Execution contract, guidance: "Provide one fenced json block containing a valid, self-contained execution contract with `knowledgeBaseWorktree`, `gitLabMergeRequest`, and `confluenceUpdate` objects. `knowledgeBaseWorktree` must state the verified source repository, target worktree path, branch `docs/sprint-triage-<start>-to-<end>`, final report path, ledger path, index path, and exact index Markdown; the final report must copy the approved staged report verbatim and the ledger must match the approved ledger. `gitLabMergeRequest` must state target branch, immutable MR title, and verified host-template handling; when no template is verified, require creation without a description adjustment, read-back, and updates only to the managed region. `confluenceUpdate` must state the configured page title and verified URL, current version/hash, top-insertion mode, existing-guide comparison result, and that only the approved Publication fragment is inserted." }
    transitions: {ready: checkout, gaps: collect, blocked: $pause, handoff: plan}
  checkout:
    title: Create knowledge-base worktree
    prompt: {file: steps/sprint-triage/checkout.md}
    agent: scout
    maxToolCalls: 10
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: implement, blocked: $pause, handoff: checkout}
  implement:
    title: Commit approved KB files
    prompt: {file: steps/sprint-triage/implement.md}
    agent: worker
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, edit, write]
      bash: {mode: unrestricted}
    transitions: {ready: publish, blocked: $pause, handoff: implement}
  publish:
    title: Open MR and insert Confluence guide
    prompt: {file: steps/sprint-triage/publish.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, gitlab]
      bash: {mode: unrestricted}
    transitions: {ready: $done, gaps: implement, blocked: $pause, handoff: publish}
