version: 1
id: investigate
command: investigate
description: "Jira or question → scope → research → review → write report."
start: intake
maxStepVisits: 30
summaryMaxChars: 30000
steps:
  intake:
    title: Pull Jira or normalize the question
    prompt: {file: steps/investigate/intake.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: intake, blocked: $pause, handoff: intake}
  plan:
    title: Approve investigation scope
    prompt: {file: steps/investigate/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, grafana, slack, superset, query-writer]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 6000
        requiredSubstrings:
          - "# Report destination"
          - "## Goal/Acceptance Criteria"
          - "## Non Goal"
          - "## Investigation Resources"
          - "## Questions"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: research, changes-requested: plan, retry: plan, blocked: $pause, handoff: plan}
  research:
    title: Deep-research the approved scope
    prompt: {file: steps/investigate/research.md}
    agent: planner
    maxToolCalls: 300
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, grafana, slack, gitlab, superset, query-writer]
      extensions: []
      skills: [systematic-debugging, grafana-logs]
      bash: {mode: unrestricted}
    transitions: {ready: validate, retry: research, blocked: $pause, handoff: research}
  validate:
    title: Check the draft against the goal
    prompt: {file: steps/investigate/validate.md}
    agent: reviewer
    maxToolCalls: 300
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, sourcegraph, glean, grafana, slack, gitlab, superset, query-writer]
      extensions: []
      skills: [verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {approved: write-report, gaps: research, retry: validate, blocked: validate, handoff: validate}
  write-report:
    title: Write the approved report file
    prompt: {file: steps/investigate/write-report.md}
    agent: scout
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, write]
      mcp: []
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: $done, retry: write-report, blocked: $pause, handoff: write-report}
