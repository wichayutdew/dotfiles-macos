version: 1
id: investigate
command: investigate
description: "Jira or question → scope → research → review → write report."
start: intake
maxStepVisits: 30
summaryMaxChars: 30000
steps:
  intake:
    title: Pull Jira or normalize the question
    prompt: {file: steps/investigate/intake.md}
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      bash: {mode: unrestricted}
    transitions: {ready: plan, blocked: $pause, handoff: intake}
  plan:
    title: Approve investigation scope
    prompt: {file: steps/investigate/plan.md}
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, grafana, slack, superset, query-writer]
      bash: {mode: unrestricted}
    gate:
      artifactContract:
        maxChars: 6000
        requiredHeadings:
          - { level: 1, title: Report destination, guidance: "Use the exact path ~/repositories/investigation-findings/<slug>.md." }
          - { level: 2, title: Goal/Acceptance Criteria, guidance: "State the investigation outcome and acceptance criteria." }
          - { level: 2, title: Non Goal, guidance: "State explicitly excluded scope." }
          - { level: 2, title: Investigation Resources, guidance: "List each relevant tool or MCP and why it matters to the goal." }
          - { level: 2, title: Questions, guidance: "List open user questions, or `None`." }
    transitions: {ready: research, gaps: intake, blocked: $pause, handoff: plan}
  research:
    title: Deep-research the approved scope
    prompt: {file: steps/investigate/research.md}
    agent: planner
    maxToolCalls: 300
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, grafana, slack, gitlab, superset, query-writer]
      skills: [systematic-debugging, grafana-logs]
      bash: {mode: unrestricted}
    transitions: {ready: validate, blocked: $pause, handoff: research}
  validate:
    title: Check the draft against the goal
    prompt: {file: steps/investigate/validate.md}
    agent: reviewer
    maxToolCalls: 300
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, sourcegraph, glean, grafana, slack, gitlab, superset, query-writer]
      skills: [verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {ready: write-report, gaps: research, blocked: $pause, handoff: validate}
  write-report:
    title: Write the approved report file
    prompt: {file: steps/investigate/write-report.md}
    agent: scout
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, write]
      bash: {mode: unrestricted}
    transitions: {ready: $done, gaps: validate, blocked: $pause, handoff: write-report}
